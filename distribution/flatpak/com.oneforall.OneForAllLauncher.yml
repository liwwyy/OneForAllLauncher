id: com.oneforall.OneForAllLauncher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: oneforall_app
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create

modules:
  - name: xrandr
    buildsystem: meson
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/archive/individual/app/xrandr-1.5.4.tar.xz
        sha256: 2cafccb2aaf2491a4068676117a0d4f90ab307724b96fffc54cd1da953779400
    cleanup:
      - /share/man

  - name: oneforall-launcher
    buildsystem: simple
    only-arches:
      - x86_64
    sources:
      - type: file
        path: oneforall-launcher.deb
      - type: file
        path: com.oneforall.OneForAllLauncher.metainfo.xml
    build-commands:
      - ar x oneforall-launcher.deb
      - tar xf data.tar.*
      - install -Dm755 usr/bin/oneforall_app -t /app/bin
      - |
        for dir in usr/share/icons/hicolor/*/; do
          size=$(basename "$dir" | cut -d@ -f1)
          install -Dm644 "$dir/apps/oneforall_app.png" "/app/share/icons/hicolor/$size/apps/$FLATPAK_ID.png"
        done
      - sed -e "s|^Exec=.*|Exec=oneforall_app %u|" -e "s|^Icon=.*|Icon=$FLATPAK_ID|" usr/share/applications/oneforall_app.desktop > $FLATPAK_ID.desktop
      - install -Dm644 $FLATPAK_ID.desktop -t /app/share/applications
      - install -Dm644 $FLATPAK_ID.metainfo.xml -t /app/share/metainfo
