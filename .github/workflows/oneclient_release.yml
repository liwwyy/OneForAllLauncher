name: OneForAllLauncher Release Build


on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: true

concurrency:
  group: oneforall-release
  cancel-in-progress: false

# Thin LTO produces optimized release builds with reasonable CI memory usage.
env:
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_BUILD_JOBS: '2'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve fork version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          TAG="oneforall-$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump the workspace version before releasing again."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os_key: darwin
            arch: aarch64
            formats: app,dmg
          - platform: macos-latest
            target: x86_64-apple-darwin
            os_key: darwin
            arch: x86_64
            formats: app,dmg
            macos_deployment_target: '10.14'
          - platform: ubuntu-22.04
            target: ''
            os_key: linux
            arch: x86_64
            formats: deb,appimage
          - platform: windows-latest
            target: ''
            os_key: windows
            arch: x86_64
            formats: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: (macOS) Pin deployment target
        if: matrix.macos_deployment_target != ''
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos_deployment_target }}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          save-cache: true
          restore-cache: true
          cache-namespace: fork-release-thin

      - name: (Linux) Free build disk space
        if: matrix.os_key == 'linux'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: (Linux) Install system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config clang python3 \
            libfontconfig-dev libfreetype-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libdbus-1-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            libfuse2

      - name: Install cargo-packager
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-packager
          version: 0.11.8

      - name: Build release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --locked --release --bin oneforall_app --target ${{ matrix.target }}
          else
            cargo build --locked --release --bin oneforall_app
          fi

      - name: (macOS) Verify deployment target
        if: matrix.macos_deployment_target != ''
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/oneforall_app"
          minos="$(vtool -show-build "$bin" | awk '/minos/ {print $2; exit}')"
          echo "linked minos=$minos, declared minimum=${{ matrix.macos_deployment_target }}"
          if [ "$(printf '%s\n%s\n' "$minos" "${{ matrix.macos_deployment_target }}" | sort -V | tail -n1)" != "${{ matrix.macos_deployment_target }}" ]; then
            echo "::error::Binary requires macOS $minos but the bundle advertises ${{ matrix.macos_deployment_target }}."
            exit 1
          fi

      - name: (Windows) Stage app-local VC++ runtime
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: python3 distribution/windows/bundle-crt.py

      - name: (Windows) Verify staged runtime is Microsoft-signed
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem 'target/crt/*.dll')
          if ($dlls.Count -eq 0) { Write-Error 'no CRT DLLs staged'; exit 1 }
          foreach ($dll in $dlls) {
            $sig = Get-AuthenticodeSignature $dll.FullName
            Write-Host "$($dll.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "$($dll.Name) signature is $($sig.Status), refusing to ship it"
              exit 1
            }
            if ($sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              Write-Error "$($dll.Name) is not signed by Microsoft"
              exit 1
            }
          }

      - name: Package (unsigned fork builds)
        shell: bash
        env:
          CI: 'true'
          # Cargo strips the executable; linuxdeploy's old strip cannot read modern RELR libraries.
          NO_STRIP: '1'
        run: |
          ARGS="--release --formats ${{ matrix.formats }}"
          if [ -n "${{ matrix.target }}" ]; then
            ARGS="$ARGS --target ${{ matrix.target }}"
          fi
          cargo packager $ARGS --verbose

      - name: Resolve packager output dir
        id: outdir
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            echo "dir=target/${{ matrix.target }}/release" >> "$GITHUB_OUTPUT"
          else
            echo "dir=target/release" >> "$GITHUB_OUTPUT"
          fi

      - name: (Linux) Install cargo-generate-rpm
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-generate-rpm
          version: 0.21.0

      - name: (Linux) Build RPM
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          cp target/release/.cargo-packager/deb/*/data/usr/share/applications/oneforall_app.desktop \
             target/release/oneforall_app.desktop
          cargo generate-rpm -p packages/oneclient_app
          cp target/generate-rpm/*.rpm "${{ steps.outdir.outputs.dir }}/"

      - name: (Windows) Smoke-test installer layout
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'C:\oneforall-smoke'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          $exe = Resolve-Path (Get-ChildItem '${{ steps.outdir.outputs.dir }}/*-setup.exe')[0].FullName
          # NSIS: /S is silent, /D= sets the install dir and must be the last arg.
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$dest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited $($p.ExitCode)"; exit 1 }

          Write-Host '--- installed layout ---'
          Get-ChildItem -Recurse $dest | ForEach-Object { Write-Host $_.FullName }

          if (-not (Test-Path "$dest\oneforall_app.exe")) {
            Write-Error "oneforall_app.exe is not at the root of $dest"
            exit 1
          }
          foreach ($dll in @(Get-ChildItem 'target/crt/*.dll')) {
            if (-not (Test-Path (Join-Path $dest $dll.Name))) {
              Write-Error "$($dll.Name) did not land beside oneforall_app.exe - cargo-packager put resources elsewhere, so app-local CRT loading will not work"
              exit 1
            }
          }
          Write-Host "OK: $($(Get-ChildItem 'target/crt/*.dll').Count) CRT DLLs sit beside oneforall_app.exe"

      # Upload debug info (dSYM / .dwp / .pdb produced by the release profile's
      # split-debuginfo) to Sentry so nightly crash reports get real file/function/
      # line stack traces instead of raw addresses. Runs on every main push, so
      # each unique build's symbols land in Sentry (matched by debug-id). Skips
      # silently unless SENTRY_AUTH_TOKEN secret + SENTRY_ORG/SENTRY_PROJECT vars
      # are configured.
      - name: Collect release assets
        shell: bash
        env:
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OS_KEY: ${{ matrix.os_key }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          prefix="OneForAllLauncher_${VERSION}_${OS_KEY}_${ARCH}"
          case "$OS_KEY" in
            windows) extensions=(exe); patterns=("$OUT_DIR"/*-setup.exe) ;;
            linux) extensions=(deb rpm AppImage); patterns=("$OUT_DIR"/*.deb "$OUT_DIR"/*.rpm "$OUT_DIR"/*.AppImage) ;;
            darwin) extensions=(dmg); patterns=("$OUT_DIR"/*.dmg) ;;
          esac
          if [ "${#patterns[@]}" -ne "${#extensions[@]}" ]; then
            echo "::error::Missing or duplicate package formats in $OUT_DIR"
            ls -la "$OUT_DIR"
            exit 1
          fi
          for i in "${!extensions[@]}"; do
            cp "${patterns[$i]}" "dist/$prefix.${extensions[$i]}"
          done
          if [ "$OS_KEY" = darwin ]; then
            apps=("$OUT_DIR"/*.app)
            [ "${#apps[@]}" -eq 1 ]
            tar -czf "dist/$prefix.app.tar.gz" -C "$OUT_DIR" "$(basename "${apps[0]}")"
          fi
          # These builds are unsigned; automatic updates remain disabled.
          ls -lh dist

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os_key }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          for suffix in windows_x86_64.exe linux_x86_64.deb linux_x86_64.rpm linux_x86_64.AppImage darwin_aarch64.dmg darwin_aarch64.app.tar.gz darwin_x86_64.dmg darwin_x86_64.app.tar.gz; do
            test -s "dist/OneForAllLauncher_${VERSION}_${suffix}"
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cp FORK_CHANGELOG.md notes.md
          cat >> notes.md <<'NOTES'

          ## Downloads

          Windows: `.exe` installer. Linux: `.deb`, `.rpm`, or `.AppImage` (mark the AppImage executable). macOS: `.dmg` or `.app.tar.gz`, choosing `aarch64` for Apple Silicon or `x86_64` for Intel.

          These fork builds are unsigned and macOS builds are not notarized. Windows SmartScreen or macOS Gatekeeper may prompt or block them. Automatic updates are disabled. Checksums are in SHA256SUMS.txt; corresponding GPL-3.0 source is available from the source archives for this exact release tag. Original LICENSE and ATTRIBUTION.md are preserved.
          NOTES
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
            --title "OneForAllLauncher $VERSION" --notes-file notes.md "${args[@]}"
