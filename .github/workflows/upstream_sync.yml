name: Stable Upstream Sync

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: stable-upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check stable OneClient release and publish badge data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 distribution/upstream_sync.py --publish
